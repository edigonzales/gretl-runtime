dependencies {
    implementation 'org.apache.sshd:sshd-core:2.20.1'
    implementation 'org.apache.sshd:sshd-sftp:2.20.1'
    implementation 'tools.jackson.core:jackson-databind:3.1.8'
    // Keep the existing Jackson 2 runtime version floor for the AWS SDK.
    runtimeOnly platform('com.fasterxml.jackson:jackson-bom:2.17.2')
    implementation 'org.apache.commons:commons-compress:1.27.1'
    api project(':gretl-api')
    implementation project(':gretl-i18n')
    implementation 'net.sf.saxon:Saxon-HE:11.4'
    runtimeOnly 'org.xmlresolver:xmlresolver:4.4.3'
    implementation 'commons-net:commons-net:3.6'
    implementation('software.amazon.awssdk:s3:2.15.64') {
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
        exclude group: 'software.amazon.awssdk', module: 'apache-client'
    }
    implementation 'software.amazon.awssdk:url-connection-client:2.15.64'
    testImplementation project(':gretl-runner')
    testImplementation 'org.mockftpserver:MockFtpServer:2.7.1'
}

jar.manifest.attributes('Automatic-Module-Name': 'ch.so.agi.gretl.tasks.io')
