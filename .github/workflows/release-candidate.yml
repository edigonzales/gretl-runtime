name: release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    uses: ./.github/workflows/qualification.yml
  linux-x86_64:
    name: Linux x86-64 release candidate
    needs: qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: verified-runtime-${{ github.sha }}
          path: qualified-runtime
      - name: Verify qualified distribution checksums
        run: |
          unzip -q qualified-runtime/gretl-runtime-*-bin.zip -d "$RUNNER_TEMP/gretl-dist"
          cd "$RUNNER_TEMP"/gretl-dist/gretl-runtime-*
          sha256sum -c SHA256SUMS
      - name: Package and start a job from that distribution
        run: |
          cd "$RUNNER_TEMP"/gretl-dist/gretl-runtime-*
          ./bin/gretl package examples/ili-validator/job-package.json --output "$RUNNER_TEMP/ili-job.jar"
          java -jar "$RUNNER_TEMP/ili-job.jar" --report "$RUNNER_TEMP/ili-job-report.json"
      - name: Upload qualified distribution
        uses: actions/upload-artifact@v4
        with:
          name: gretl-runtime-linux-x86_64
          path: qualified-runtime/gretl-runtime-*-bin.zip
          if-no-files-found: error
