name: IMAGE diagnosis

# The regular push/PR qualification already includes IMAGE/full.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'External service scope; both choices start real runtime containers'
        required: true
        default: full
        type: choice
        options: [local, full]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and qualify the generic candidate runtime
        env:
          SCOPE: ${{ inputs.scope }}
        run: scripts/verify-job-matrix.sh --mode IMAGE --scope "$SCOPE" --output "$RUNNER_TEMP/gretl-image"
      - name: Check false-green rejection
        env:
          SCOPE: ${{ inputs.scope }}
        run: python3 tests/script-first-testing/test_job_evidence.py --mode IMAGE --scope "$SCOPE" --evidence-root "$RUNNER_TEMP/gretl-image/IMAGE/evidence"
      - name: Preserve IMAGE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-diagnosis-${{ github.sha }}
          retention-days: 7
          path: ${{ runner.temp }}/gretl-image/IMAGE/
          if-no-files-found: error
