name: SCRIPT-first qualification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  standard:
    name: Docker-free SCRIPT standard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify standard and preserve audited evidence
        env:
          DOCKER_HOST: unix:///tmp/gretl-intentionally-unavailable-docker.sock
        run: scripts/verify-job-matrix.sh --mode SCRIPT --scope local --output "$RUNNER_TEMP/gretl-standard"
      - name: Reject incomplete and foreign standard evidence
        run: python3 tests/script-first-testing/test_job_evidence.py --mode SCRIPT --scope local --evidence-root "$RUNNER_TEMP/gretl-standard/SCRIPT/evidence"
      - name: Test publication download verification
        run: python3 -m unittest discover -s tests/publication -v
      - name: Preserve standard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standard-SCRIPT-${{ github.sha }}
          retention-days: 7
          path: ${{ runner.temp }}/gretl-standard/SCRIPT/
          if-no-files-found: error

  full:
    name: SCRIPT, JAR and external-SCRIPT IMAGE full
    runs-on: ubuntu-latest
    # Local ARM64 measurements: about 8/12/12 minutes plus archive/audit work.
    # Keep every existing package/service gate and allow headroom on hosted runners.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify all three modes on this commit
        run: scripts/verify-job-matrix.sh --mode ALL --scope full --output "$RUNNER_TEMP/gretl-full"
      - name: Reject false-green evidence in every full mode
        run: |
          for mode in SCRIPT JAR IMAGE; do
            python3 tests/script-first-testing/test_job_evidence.py --mode "$mode" --scope full --evidence-root "$RUNNER_TEMP/gretl-full/$mode/evidence"
          done
      - name: Preserve SCRIPT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-SCRIPT-${{ github.sha }}
          retention-days: 7
          path: ${{ runner.temp }}/gretl-full/SCRIPT/
          if-no-files-found: error
      - name: Preserve JAR evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-JAR-${{ github.sha }}
          retention-days: 7
          path: ${{ runner.temp }}/gretl-full/JAR/
          if-no-files-found: error
      - name: Preserve IMAGE evidence and matrix completion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-IMAGE-${{ github.sha }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/gretl-full/IMAGE/
            ${{ runner.temp }}/gretl-full/complete.json
          if-no-files-found: error
      - name: Preserve qualified distribution
        uses: actions/upload-artifact@v4
        with:
          name: verified-runtime-${{ github.sha }}
          retention-days: 7
          path: gretl-dist/target/gretl-runtime-*-bin.zip
          if-no-files-found: error
