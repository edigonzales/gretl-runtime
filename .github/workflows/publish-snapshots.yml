name: publish artefacts

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gretl-snapshot-publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish artefacts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Standard verification
        run: ./mvnw -B clean verify

      - name: Preserve standard verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standard-evidence-${{ github.sha }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/site/jacoco*/
            **/target/job-evidence/**/execution.json
            **/target/job-evidence/**/report.json
            **/target/job-evidence/**/*.stdout.log
            **/target/job-evidence/**/*.stderr.log
            **/target/job-evidence/**/output/

      - name: Run all tests including GeoTools and backing-service profiles
        run: ./mvnw -B -Pgeotools-probe,backing-services clean verify

      - name: Preserve full verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-evidence-${{ github.sha }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/site/jacoco*/
            **/target/service-evidence/
            **/target/job-evidence/**/execution.json
            **/target/job-evidence/**/report.json
            **/target/job-evidence/**/*.stdout.log
            **/target/job-evidence/**/*.stderr.log
            **/target/job-evidence/**/output/

      - name: Publish snapshot artefacts
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: >-
          ./mvnw -B
          -s docs/implementation/publish-settings.xml
          -Ppublish-snapshots
          -DskipTests -DskipITs
          deploy
