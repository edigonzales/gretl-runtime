name: verification and snapshots

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gretl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test snapshot archive verification
        run: python3.12 -m unittest discover -s tests/publication
      - name: Qualify runtime, distribution and tools
        run: python3.12 scripts/verify-runtime.py
      - name: Record distribution hashes
        working-directory: gretl-cli/build/distributions
        run: sha256sum *.zip *.tar.gz > distribution.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: verified-runtime-${{ github.sha }}
          if-no-files-found: error
          path: gretl-cli/build/distributions/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            vscode/gretl-vscode/dist/*.vsix
            gretl-lsp/build/libs/*-jar-with-dependencies.jar

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/gretl-verified-runtime
      - name: Publish qualified distribution and libraries
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          if [[ -z "$MAVEN_USERNAME" || -z "$MAVEN_PASSWORD" ]]; then
            echo "Configure MAVEN_USERNAME and MAVEN_PASSWORD before publishing." >&2
            exit 2
          fi
          qualified="$RUNNER_TEMP/gretl-verified-runtime"
          (cd "$qualified" && sha256sum --check distribution.sha256)
          ./gradlew publish -PqualifiedDistribution="$qualified"
      - name: Verify published archives and execute an external job
        run: |
          python3.12 scripts/verify-published-runtime.py \
            --repository https://jars.interlis.guru/snapshots \
            --version 6.0.0-SNAPSHOT --source "$GITHUB_SHA" \
            --checksums "$RUNNER_TEMP/gretl-verified-runtime/distribution.sha256" \
            --output "$RUNNER_TEMP/gretl-published-runtime"
