name: verification and snapshots

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gretl-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualification:
    uses: ./.github/workflows/qualification.yml
  publish:
    name: publish snapshot artefacts
    needs: qualification
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Deployment retains the existing Maven path; skips apply only after both required jobs passed.
      - name: Publish snapshot artefacts
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: >-
          ./mvnw -B
          -s docs/implementation/publish-settings.xml
          -Ppublish-snapshots
          -DskipTests -DskipITs
          deploy
