name: publish artefacts

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gretl-snapshot-publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish artefacts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run all tests including GeoTools profile
        run: ./mvnw -B -Pgeotools-probe clean verify

      - name: Publish snapshot artefacts
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: >-
          ./mvnw -B
          -s docs/implementation/publish-settings.xml
          -Ppublish-snapshots
          -DskipTests -DskipITs
          deploy
