name: verification and snapshots

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: gretl-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode/gretl-vscode/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check documentation and snapshot smoke tooling
        run: |
          python3.12 scripts/check-docs.py
          python3.12 -m unittest discover -s tests/docs -v
          python3.12 -m unittest discover -s tests/publication -v
          python3.12 -m unittest discover -s tests/ci -v
      - name: Verify SCRIPT, detached JAR and targeted IMAGE processes
        run: python3.12 scripts/verify-runtime.py
      - name: Record qualified distribution hashes
        working-directory: gretl-dist/target
        run: |
          sha256sum gretl-runtime-6.0.0-SNAPSHOT-bin.zip gretl-runtime-6.0.0-SNAPSHOT-bin.tar.gz > distribution.sha256
      - name: Preserve qualified distribution
        uses: actions/upload-artifact@v4
        with:
          name: verified-runtime-${{ github.sha }}
          retention-days: 7
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          path: |
            gretl-dist/target/gretl-runtime-6.0.0-SNAPSHOT-bin.zip
            gretl-dist/target/gretl-runtime-6.0.0-SNAPSHOT-bin.tar.gz
            gretl-dist/target/distribution.sha256
      - name: Summarize test failures
        if: failure()
        run: |
          python3.12 - <<'PY' > "$RUNNER_TEMP/gretl-test-summary.txt"
          from pathlib import Path
          from xml.etree import ElementTree

          reports = sorted(Path(".").glob("*/target/*-reports/TEST-*.xml"))
          print(f"Found {len(reports)} Maven test reports. See the job log for failure details.")
          for path in reports[:250]:
              suite = ElementTree.parse(path).getroot()
              counts = [int(suite.get(key, "0")) for key in ("tests", "failures", "errors", "skipped")]
              print(str(path)[:200], *counts)
          PY
      - name: Preserve test summary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary-${{ github.sha }}
          retention-days: 7
          overwrite: true
          path: ${{ runner.temp }}/gretl-test-summary.txt
          if-no-files-found: error

  publish:
    name: publish snapshot artefacts
    needs: verify
    if: needs.verify.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode/gretl-vscode/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: verified-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/gretl-verified-runtime
      - name: Install the qualified archives into the deploy reactor
        run: |
          qualified="$RUNNER_TEMP/gretl-verified-runtime"
          mkdir -p gretl-dist/target
          cp "$qualified/gretl-runtime-6.0.0-SNAPSHOT-bin.zip" \
             "$qualified/gretl-runtime-6.0.0-SNAPSHOT-bin.tar.gz" gretl-dist/target/
          cd gretl-dist/target
          sha256sum gretl-runtime-6.0.0-SNAPSHOT-bin.zip gretl-runtime-6.0.0-SNAPSHOT-bin.tar.gz \
            | cmp - "$qualified/distribution.sha256"
      - name: Require publishing credentials
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          if [[ -z "$MAVEN_USERNAME" || -z "$MAVEN_PASSWORD" ]]; then
            echo "Configure Actions secrets MAVEN_USERNAME and MAVEN_PASSWORD for interlis-snapshots." >&2
            exit 2
          fi
      - name: Publish snapshot artefacts
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: >-
          ./mvnw -B -s scripts/publish-settings.xml -Ppublish-snapshots
          -Dgretl.dist.reuseQualifiedArchives=true -DskipTests -DskipITs deploy
      - name: Recheck local archive inputs after deploy
        working-directory: gretl-dist/target
        run: sha256sum --strict --check "$RUNNER_TEMP/gretl-verified-runtime/distribution.sha256"
      - name: Download published runtime and execute an external Groovy job
        run: |
          python3.12 scripts/verify-published-runtime.py \
            --repository https://jars.interlis.guru/snapshots \
            --version 6.0.0-SNAPSHOT --source "$GITHUB_SHA" \
            --checksums "$RUNNER_TEMP/gretl-verified-runtime/distribution.sha256" \
            --output "$RUNNER_TEMP/gretl-published-runtime"
