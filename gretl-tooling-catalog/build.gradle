dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    api project(':gretl-tooling-core')
    api project(':gretl-api')
    runtimeOnly project(':gretl-io-tasks')
    runtimeOnly project(':gretl-database-tasks')
    runtimeOnly project(':gretl-interlis-tasks')
    runtimeOnly project(':gretl-ilivalidator')
}

def catalogDirectory = layout.buildDirectory.dir('catalog')

tasks.register('generateCatalog', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ch.so.agi.gretl.tooling.catalog.RuntimeCatalogBootstrap'
    args catalogDirectory.get().asFile, project.version
    inputs.property('runtimeVersion', project.version)
    outputs.dir catalogDirectory
}

tasks.register('catalogJar', Jar) {
    archiveClassifier = 'catalog'
    dependsOn generateCatalog
    from catalogDirectory
}

configurations {
    catalogElements {
        canBeResolved = false
        attributes.attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
        outgoing.capability("${project.group}:${project.name}-catalog:${project.version}")
    }
}

artifacts {
    catalogElements catalogJar
}

components.java.addVariantsFromConfiguration(configurations.catalogElements) {
    mapToMavenScope('runtime')
}
