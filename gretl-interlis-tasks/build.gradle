dependencies {
    api project(':gretl-api')
    api project(':gretl-i18n')
    api('ch.interlis:iox-wkf:2.0.1-20250417.084407-2') {
        exclude group: 'org.geotools'
        exclude group: 'ch.interlis', module: 'ili2pg'
        exclude group: 'ch.interlis', module: 'ili2gpkg'
        exclude group: 'ch.interlis', module: 'ili2c-tool'
        exclude group: 'ch.interlis', module: 'ili2c-core'
        exclude group: 'ch.interlis', module: 'iox-ili'
    }
    api('io.github.sogis:iox-formats:1.0.3') {
        exclude group: 'org.geotools'
        exclude group: 'ch.interlis', module: 'iox-wkf'
    }
    api 'ch.interlis:ili2c-core:5.6.8'
    api('ch.interlis:ili2c-tool:5.6.8') {
        exclude group: 'javax.activation', module: 'activation'
        exclude group: 'com.sun.xml.bind', module: 'jaxb-core'
    }
    api 'ch.interlis:iox-ili:1.24.4'
    api('ch.interlis:ili2pg:5.5.1') {
        exclude group: 'ch.ehi', module: 'ehisqlgen'
        exclude group: 'ch.interlis', module: 'iox-ili'
    }
    api 'ch.ehi:ehisqlgen:1.16.3'
    api('ch.interlis:ili2duckdb:5.5.1') {
        exclude group: 'ch.ehi', module: 'ehisqlgen'
        exclude group: 'ch.interlis', module: 'iox-ili'
    }
    api('io.github.sogis:av2ch:1.1.8') {
        exclude group: 'ch.qos.logback', module: 'logback-classic'
    }
    api('ch.interlis:av2geobau:1.4.2') {
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }
    api('ch.interlis:ili2gpkg:5.5.1') {
        exclude group: 'ch.ehi', module: 'ehisqlgen'
        exclude group: 'ch.interlis', module: 'iox-ili'
    }
    api('ch.interlis:ilivalidator:1.15.0') {
        exclude group: 'javax.activation', module: 'activation'
        exclude group: 'com.sun.xml.bind', module: 'jaxb-core'
    }
    testImplementation 'io.github.sogis:ilivalidator-custom-functions:1.1.50'
    testImplementation 'io.github.sogis:ilivalidator-custom-functions-geometries:0.0.8'
    testImplementation 'ch.geowerkstatt.ilivalidator.extensions.functions:geow-interlis-functions:0.2.1'
    testImplementation 'ch.geowerkstatt.ilivalidator.extensions.functions:interlis-functions-ngk-so:1.0.3'
    api 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    runtimeOnly 'org.postgresql:postgresql:42.7.14'
    runtimeOnly 'org.duckdb:duckdb_jdbc:1.5.2.0'
    runtimeOnly 'org.xerial:sqlite-jdbc:3.53.2.0'
    testImplementation project(':gretl-runner')
}

configurations {
    standardFunctionsElements {
        canBeResolved = false
    }
}

tasks.register('standardFunctionsJar', Jar) {
    archiveClassifier = 'standard-functions'
    from 'src/standard-functions/resources'
}

artifacts {
    standardFunctionsElements standardFunctionsJar
}

sourceSets.test.resources.srcDir 'src/standard-functions/resources'

publishing.publications.library.artifact(standardFunctionsJar)

dependencies {
    constraints {
        implementation 'org.apache.poi:poi:5.2.5'
        implementation 'org.apache.poi:poi-ooxml:5.2.5'
        implementation 'commons-io:commons-io:2.18.0'
    }
}
