dependencies {
    testImplementation project(':gretl-api')
    testImplementation project(':gretl-runner')
    testImplementation project(':gretl-logging')
    testImplementation project(':gretl-cli')
    testImplementation 'ch.interlis:iox-ili:1.24.4'
    testImplementation 'org.apache.poi:poi-ooxml:5.2.5'
    testImplementation('org.testcontainers:testcontainers:1.21.4') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    testImplementation('org.testcontainers:postgresql:1.21.4') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    testRuntimeOnly 'org.postgresql:postgresql:42.7.14'
    testImplementation 'commons-net:commons-net:3.6'
    testImplementation('io.floci:testcontainers-floci:1.10.0') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    testImplementation('software.amazon.awssdk:s3:2.15.64') {
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
        exclude group: 'software.amazon.awssdk', module: 'apache-client'
    }
    testImplementation 'software.amazon.awssdk:url-connection-client:2.15.64'
}

def cli = project(':gretl-cli')
evaluationDependsOn(cli.path)
def distribution = cli.tasks.named('installDist')
def archive = cli.tasks.named('distZip')
def installedDirectory = distribution.map { it.destinationDir }

tasks.withType(Test).configureEach {
    inputs.dir(installedDirectory).withPathSensitivity(PathSensitivity.RELATIVE)
}

test {
    inputs.file(archive.flatMap { it.archiveFile }).withPathSensitivity(PathSensitivity.NONE)
}

tasks.withType(Test).configureEach {
    dependsOn distribution, archive
    systemProperty 'gretl.test.reactorDistribution', distribution.get().destinationDir
    systemProperty 'gretl.test.distributionArchive', archive.get().archiveFile.get().asFile
}

['jarTest': 'jar', 'serviceTest': 'docker', 'imageTest': 'image'].each { taskName, tag ->
    tasks.register(taskName, Test) {
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform { includeTags tag }
        if (tag == 'image') {
            dependsOn ':gretl-cli:dockerBuild'
            systemProperty 'gretl.test.image', 'gretl-runtime:local'
            outputs.upToDateWhen { false }
        }
    }
}

// Exercise the deployed component against its own dependencies.
def validator = project(':gretl-interlis-tasks')
evaluationDependsOn(validator.path)
def validatorClasspath = files(validator.tasks.named('jar'), validator.configurations.runtimeClasspath)
test {
    inputs.files(validatorClasspath)
    doFirst {
        systemProperty 'gretl.test.validatorClasspath', validatorClasspath.asPath
    }
}
